<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 574" role="img"
   aria-label="Pipeline: a sequence file is parsed, coordinates normalised once, and becomes an immutable Plasmid object. Five engines read it: search, enzymes, primers, alignment and serialize. The first four render layers composited into one SVG map; serialize writes a file to disk. Viewport state and layout drive the map, and IndexedDB persists the session.">
<defs>
  <marker id="pipeline-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 1 L 9 5 L 0 9 z" fill="currentColor"/>
  </marker>
</defs>

