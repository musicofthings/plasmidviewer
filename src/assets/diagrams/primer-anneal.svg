<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 396" role="img"
   aria-label="Two cases of the primer annealing walk. Case one: a 26-nucleotide primer with a 6-nucleotide 5-prime tail hanging off the front of the template; the 20 annealing bases pair and the quoted melting temperature covers only those. Case two: an interior mismatch three bases from the 5-prime end; with mismatches disallowed the anneal ends there at 13 bases and the remaining three become tail, while allowing one mismatch reads through to the full 16 bases.">
<defs>
  <marker id="primer-anneal-ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 1 L 9 5 L 0 9 z" fill="currentColor"/>
  </marker>
</defs>

<!-- ===== case A ===== -->
<text font-family="var(--joy-fontFamily-code, ui-monospace, Menlo, monospace)" font-size="12.5" font-weight="600" fill="var(--joy-palette-text-primary)" x="24" y="30">A · 5′ tail, exact anneal</text>
<text font-family="var(--joy-fontFamily-body, system-ui, sans-serif)" font-size="11" fill="var(--joy-palette-text-tertiary)" x="216" y="30">MCS-F on pTestRE — 1 site, 20 nt anneal</text>

<!-- walk arrow -->
<g color="var(--joy-palette-success-500)">
  <line stroke-width="1.3" fill="none" x1="664" y1="54" x2="278" y2="54" stroke="var(--joy-palette-success-500)" marker-end="url(#primer-anneal-ar2)"/>
</g>
<text font-family="var(--joy-fontFamily-code, ui-monospace, Menlo, monospace)" font-size="10" x="330" y="42" fill="var(--joy-palette-success-500)">walk runs 5′-wards from the 3′ base</text>

<text font-family="var(--joy-fontFamily-body, system-ui, sans-serif)" font-size="11" fill="var(--joy-palette-text-tertiary)" x="140" y="84" text-anchor="end">5′</text>
<text font-family="var(--joy-fontFamily-body, system-ui, sans-serif)" font-size="11" fill="var(--joy-palette-text-tertiary)" x="684" y="84">3′</text>

<!-- Bases sit on a 20 px grid: textLength pins each run to it, so the pairing ticks
     below stay in register instead of drifting off by the font's own advance. -->
<text font-family="var(--joy-fontFamily-code, ui-monospace, Menlo, monospace)" font-size="15" x="153.5" y="84" fill="var(--joy-palette-text-tertiary)" textLength="120" lengthAdjust="spacing">CTCGAG</text>
<text font-family="var(--joy-fontFamily-code, ui-monospace, Menlo, monospace)" font-size="15" x="273.5" y="84" fill="var(--joy-palette-success-500)" textLength="400" lengthAdjust="spacing">AAAAGAATTCTTTTGGATCC</text>

<path d="M 148 94 L 266 94" stroke="var(--joy-palette-text-tertiary)" stroke-width="1.4" stroke-dasharray="4 3" fill="none"/>
<text font-family="var(--joy-fontFamily-code, ui-monospace, Menlo, monospace)" font-size="10" x="148" y="110" fill="var(--joy-palette-text-tertiary)">6 nt tail</text>

<!-- pairing ticks -->
<g stroke="var(--joy-palette-success-500)" stroke-width="1.3" opacity="0.65">
  <line x1="278" y1="92" x2="278" y2="112"/><line x1="298" y1="92" x2="298" y2="112"/>
  <line x1="318" y1="92" x2="318" y2="112"/><line x1="338" y1="92" x2="338" y2="112"/>
  <line x1="358" y1="92" x2="358" y2="112"/><line x1="378" y1="92" x2="378" y2="112"/>
  <line x1="398" y1="92" x2="398" y2="112"/><line x1="418" y1="92" x2="418" y2="112"/>
  <line x1="438" y1="92" x2="438" y2="112"/><line x1="458" y1="92" x2="458" y2="112"/>
  <line x1="478" y1="92" x2="478" y2="112"/><line x1="498" y1="92" x2="498" y2="112"/>
  <line x1="518" y1="92" x2="518" y2="112"/><line x1="538" y1="92" x2="538" y2="112"/>
  <line x1="558" y1="92" x2="558" y2="112"/><line x1="578" y1="92" x2="578" y2="112"/>
  <line x1="598" y1="92" x2="598" y2="112"/><line x1="618" y1="92" x2="618" y2="112"/>
  <line x1="638" y1="92" x2="638" y2="112"/><line x1="658" y1="92" x2="658" y2="112"/>
</g>

<text font-family="var(--joy-fontFamily-code, ui-monospace, Menlo, monospace)" font-size="15" x="273.5" y="130" fill="var(--joy-palette-text-primary)" textLength="400" lengthAdjust="spacing">AAAAGAATTCTTTTGGATCC</text>

<line x1="268" y1="142" x2="668" y2="142" stroke="var(--joy-palette-neutral-400)" stroke-width="1"/>
<g font-family="var(--joy-fontFamily-code, ui-monospace, Menlo, monospace)" font-size="10" fill="var(--joy-palette-text-tertiary)" text-anchor="middle">
  <text x="278" y="158">1</text><text x="378" y="158">6</text>
  <text x="478" y="158">11</text><text x="578" y="158">16</text><text x="658" y="158">20</text>
</g>
<text font-family="var(--joy-fontFamily-body, system-ui, sans-serif)" font-size="11" fill="var(--joy-palette-text-tertiary)" x="700" y="130">template — pTestRE</text>

<rect fill="var(--joy-palette-background-level1)" stroke="var(--joy-palette-neutral-400)" stroke-width="1.2" x="700" y="60" width="356" height="62" rx="6"/>
<text font-family="var(--joy-fontFamily-code, ui-monospace, Menlo, monospace)" font-size="12.5" font-weight="600" x="716" y="84" fill="var(--joy-palette-success-500)">Tm 45.8 °C</text>
<text font-family="var(--joy-fontFamily-body, system-ui, sans-serif)" font-size="11" fill="var(--joy-palette-text-tertiary)" x="716" y="104">the annealing 20 nt — not the 26-mer's 54.6 °C</text>

<line x1="24" y1="188" x2="1056" y2="188" stroke="var(--joy-palette-divider)" stroke-width="1"/>

<!-- ===== case B ===== -->
<text font-family="var(--joy-fontFamily-code, ui-monospace, Menlo, monospace)" font-size="12.5" font-weight="600" fill="var(--joy-palette-text-primary)" x="24" y="222">B · interior mismatch</text>
<text font-family="var(--joy-fontFamily-body, system-ui, sans-serif)" font-size="11" fill="var(--joy-palette-text-tertiary)" x="200" y="222">the same primer, third base broken</text>

<text font-family="var(--joy-fontFamily-body, system-ui, sans-serif)" font-size="11" fill="var(--joy-palette-text-tertiary)" x="260" y="272" text-anchor="end">5′</text>
<text font-family="var(--joy-fontFamily-body, system-ui, sans-serif)" font-size="11" fill="var(--joy-palette-text-tertiary)" x="604" y="272">3′</text>

<text font-family="var(--joy-fontFamily-code, ui-monospace, Menlo, monospace)" font-size="15" x="273.5" y="272" fill="var(--joy-palette-text-tertiary)" textLength="40" lengthAdjust="spacing">TT</text>
<text font-family="var(--joy-fontFamily-code, ui-monospace, Menlo, monospace)" font-size="15" x="313.5" y="272" fill="var(--joy-palette-danger-500)" textLength="20" lengthAdjust="spacing">C</text>
<text font-family="var(--joy-fontFamily-code, ui-monospace, Menlo, monospace)" font-size="15" x="333.5" y="272" fill="var(--joy-palette-success-500)" textLength="260" lengthAdjust="spacing">GGCATCAGTTGAC</text>

<path d="M 268 282 L 326 282" stroke="var(--joy-palette-text-tertiary)" stroke-width="1.4" stroke-dasharray="4 3" fill="none"/>

<g stroke="var(--joy-palette-success-500)" stroke-width="1.3" opacity="0.65">
  <line x1="338" y1="280" x2="338" y2="300"/><line x1="358" y1="280" x2="358" y2="300"/>
  <line x1="378" y1="280" x2="378" y2="300"/><line x1="398" y1="280" x2="398" y2="300"/>
  <line x1="418" y1="280" x2="418" y2="300"/><line x1="438" y1="280" x2="438" y2="300"/>
  <line x1="458" y1="280" x2="458" y2="300"/><line x1="478" y1="280" x2="478" y2="300"/>
  <line x1="498" y1="280" x2="498" y2="300"/><line x1="518" y1="280" x2="518" y2="300"/>
  <line x1="538" y1="280" x2="538" y2="300"/><line x1="558" y1="280" x2="558" y2="300"/>
  <line x1="578" y1="280" x2="578" y2="300"/>
</g>
<line x1="318" y1="280" x2="318" y2="300" stroke="var(--joy-palette-danger-500)" stroke-width="1.6" stroke-dasharray="3 3"/>

<text font-family="var(--joy-fontFamily-code, ui-monospace, Menlo, monospace)" font-size="15" x="273.5" y="318" fill="var(--joy-palette-text-primary)" textLength="320" lengthAdjust="spacing">TTAGGCATCAGTTGAC</text>

<g color="var(--joy-palette-danger-500)">
  <line stroke-width="1.3" fill="none" x1="318" y1="336" x2="318" y2="352" stroke="var(--joy-palette-danger-500)" marker-end="url(#primer-anneal-ar2)"/>
</g>
<text font-family="var(--joy-fontFamily-code, ui-monospace, Menlo, monospace)" font-size="10" x="248" y="368" fill="var(--joy-palette-danger-500)">walk stops here</text>

<rect fill="var(--joy-palette-background-level1)" stroke="var(--joy-palette-neutral-400)" stroke-width="1.2" x="640" y="238" width="416" height="52" rx="6"/>
<text font-family="var(--joy-fontFamily-code, ui-monospace, Menlo, monospace)" font-size="12.5" font-weight="600" fill="var(--joy-palette-text-primary)" x="656" y="262">maxMismatches: 0</text>
<text font-family="var(--joy-fontFamily-body, system-ui, sans-serif)" font-size="11" fill="var(--joy-palette-text-tertiary)" x="656" y="280">anneal ends at the mismatch → 13 nt, 3 nt tail</text>

<rect fill="var(--joy-palette-background-level1)" stroke="var(--joy-palette-neutral-400)" stroke-width="1.2" x="640" y="300" width="416" height="52" rx="6"/>
<text font-family="var(--joy-fontFamily-code, ui-monospace, Menlo, monospace)" font-size="12.5" font-weight="600" fill="var(--joy-palette-text-primary)" x="656" y="324">maxMismatches: 1</text>
<text font-family="var(--joy-fontFamily-body, system-ui, sans-serif)" font-size="11" fill="var(--joy-palette-text-tertiary)" x="656" y="342">reads through → 16 nt, mismatches: 1 — a mutagenic primer</text>
        </svg>
