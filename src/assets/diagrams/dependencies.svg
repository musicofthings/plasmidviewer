<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 424" role="img"
   aria-label="Dependency graph. Above the line: FR-37 primers is shipped and feeds FR-38 PCR simulation, which feeds FR-39 primer design; FR-34 restriction enzymes is shipped and feeds FR-49 gel simulation, which also needs product sizes from FR-38. Below the line: FR-31 mutable document model feeds FR-32 history and undo, which feeds FR-33 sequence editing, which gates all eight cloning methods in FR-40 to FR-45. A dashed edge shows that homology assembly additionally needs a PCR product from FR-38.">
<defs>
  <marker id="dependencies-ar3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 1 L 9 5 L 0 9 z" fill="currentColor"/>
  </marker>
</defs>

<!-- above the line -->
<rect stroke="var(--joy-palette-primary-600)" stroke-width="1.8" x="40"  y="30" width="180" height="56" rx="6" fill="var(--joy-palette-background-level1)"/>
<text font-family="var(--joy-fontFamily-code, ui-monospace, Menlo, monospace)" font-size="12.5" font-weight="600" x="56" y="55" fill="var(--joy-palette-primary-600)">FR-37 · primers</text>
<text font-family="var(--joy-fontFamily-body, system-ui, sans-serif)" font-size="11" fill="var(--joy-palette-text-tertiary)" x="56" y="74">shipped · 30 tests</text>

<rect fill="var(--joy-palette-background-surface)" stroke="var(--joy-palette-neutral-400)" stroke-width="1.2" x="300" y="30" width="180" height="56" rx="6"/>
<text font-family="var(--joy-fontFamily-code, ui-monospace, Menlo, monospace)" font-size="12.5" font-weight="600" fill="var(--joy-palette-text-primary)" x="316" y="55">FR-38 · PCR</text>
<text font-family="var(--joy-fontFamily-body, system-ui, sans-serif)" font-size="11" fill="var(--joy-palette-text-tertiary)" x="316" y="74">products, overlap-extension</text>

<rect fill="var(--joy-palette-background-surface)" stroke="var(--joy-palette-neutral-400)" stroke-width="1.2" x="560" y="30" width="180" height="56" rx="6"/>
<text font-family="var(--joy-fontFamily-code, ui-monospace, Menlo, monospace)" font-size="12.5" font-weight="600" fill="var(--joy-palette-text-primary)" x="576" y="55">FR-39 · design</text>
<text font-family="var(--joy-fontFamily-body, system-ui, sans-serif)" font-size="11" fill="var(--joy-palette-text-tertiary)" x="576" y="74">automatic, per procedure</text>

<rect stroke="var(--joy-palette-primary-600)" stroke-width="1.8" x="40"  y="126" width="180" height="56" rx="6" fill="var(--joy-palette-background-level1)"/>
<text font-family="var(--joy-fontFamily-code, ui-monospace, Menlo, monospace)" font-size="12.5" font-weight="600" x="56" y="151" fill="var(--joy-palette-primary-600)">FR-34 · enzymes</text>
<text font-family="var(--joy-fontFamily-body, system-ui, sans-serif)" font-size="11" fill="var(--joy-palette-text-tertiary)" x="56" y="170">shipped · REBASE v608</text>

<rect fill="var(--joy-palette-background-surface)" stroke="var(--joy-palette-neutral-400)" stroke-width="1.2" x="560" y="126" width="180" height="56" rx="6"/>
<text font-family="var(--joy-fontFamily-code, ui-monospace, Menlo, monospace)" font-size="12.5" font-weight="600" fill="var(--joy-palette-text-primary)" x="576" y="151">FR-49 · gel</text>
<text font-family="var(--joy-fontFamily-body, system-ui, sans-serif)" font-size="11" fill="var(--joy-palette-text-tertiary)" x="576" y="170">agarose, MW markers</text>

<g color="var(--joy-palette-text-tertiary)">
  <line stroke="var(--joy-palette-text-tertiary)" stroke-width="1.3" fill="none" x1="220" y1="58" x2="294" y2="58" marker-end="url(#dependencies-ar3)"/>
  <line stroke="var(--joy-palette-text-tertiary)" stroke-width="1.3" fill="none" x1="480" y1="58" x2="554" y2="58" marker-end="url(#dependencies-ar3)"/>
  <line stroke="var(--joy-palette-text-tertiary)" stroke-width="1.3" fill="none" x1="220" y1="154" x2="554" y2="154" marker-end="url(#dependencies-ar3)"/>
  <path stroke="var(--joy-palette-text-tertiary)" stroke-width="1.3" fill="none" d="M 390 86 L 390 108 L 650 108 L 650 120" marker-end="url(#dependencies-ar3)"/>
</g>
<text font-family="var(--joy-fontFamily-code, ui-monospace, Menlo, monospace)" font-size="10" fill="var(--joy-palette-text-tertiary)" x="240" y="148">fragment sizes</text>
<text font-family="var(--joy-fontFamily-code, ui-monospace, Menlo, monospace)" font-size="10" fill="var(--joy-palette-text-tertiary)" x="400" y="102">product sizes</text>

<!-- divider -->
<line x1="24" y1="212" x2="1056" y2="212" stroke="var(--joy-palette-neutral-400)" stroke-width="1.4" stroke-dasharray="7 5"/>
<text font-family="var(--joy-fontFamily-code, ui-monospace, Menlo, monospace)" font-size="10" x="24" y="204" fill="var(--joy-palette-primary-600)">▲  works on today's read-only Plasmid</text>
<text font-family="var(--joy-fontFamily-code, ui-monospace, Menlo, monospace)" font-size="10" x="24" y="230" fill="var(--joy-palette-neutral-500)">▼  gated on an editable document</text>

<!-- below the line -->
<rect fill="var(--joy-palette-background-surface)" stroke-width="1.2" x="40"  y="252" width="180" height="56" rx="6" stroke-dasharray="5 4" stroke="var(--joy-palette-neutral-500)"/>
<text font-family="var(--joy-fontFamily-code, ui-monospace, Menlo, monospace)" font-size="12.5" font-weight="600" x="56" y="277" fill="var(--joy-palette-neutral-500)">FR-31 · document</text>
<text font-family="var(--joy-fontFamily-body, system-ui, sans-serif)" font-size="11" fill="var(--joy-palette-text-tertiary)" x="56" y="296">insert / delete / replace</text>

<rect fill="var(--joy-palette-background-surface)" stroke-width="1.2" x="300" y="252" width="180" height="56" rx="6" stroke-dasharray="5 4" stroke="var(--joy-palette-neutral-500)"/>
<text font-family="var(--joy-fontFamily-code, ui-monospace, Menlo, monospace)" font-size="12.5" font-weight="600" x="316" y="277" fill="var(--joy-palette-neutral-500)">FR-32 · history</text>
<text font-family="var(--joy-fontFamily-body, system-ui, sans-serif)" font-size="11" fill="var(--joy-palette-text-tertiary)" x="316" y="296">operation log, undo</text>

<rect fill="var(--joy-palette-background-surface)" stroke-width="1.2" x="560" y="252" width="180" height="56" rx="6" stroke-dasharray="5 4" stroke="var(--joy-palette-neutral-500)"/>
<text font-family="var(--joy-fontFamily-code, ui-monospace, Menlo, monospace)" font-size="12.5" font-weight="600" x="576" y="277" fill="var(--joy-palette-neutral-500)">FR-33 · editing</text>
<text font-family="var(--joy-fontFamily-body, system-ui, sans-serif)" font-size="11" fill="var(--joy-palette-text-tertiary)" x="576" y="296">select, type, annotate</text>

<rect fill="var(--joy-palette-background-surface)" stroke-width="1.2" x="820" y="252" width="220" height="120" rx="6" stroke-dasharray="5 4" stroke="var(--joy-palette-neutral-500)"/>
<text font-family="var(--joy-fontFamily-code, ui-monospace, Menlo, monospace)" font-size="12.5" font-weight="600" x="836" y="277" fill="var(--joy-palette-neutral-500)">FR-40 … FR-45</text>
<text font-family="var(--joy-fontFamily-body, system-ui, sans-serif)" font-size="11" fill="var(--joy-palette-text-tertiary)" x="836" y="296">restriction · Gibson / HiFi /</text>
<text font-family="var(--joy-fontFamily-body, system-ui, sans-serif)" font-size="11" fill="var(--joy-palette-text-tertiary)" x="836" y="312">In-Fusion · Golden Gate ·</text>
<text font-family="var(--joy-fontFamily-body, system-ui, sans-serif)" font-size="11" fill="var(--joy-palette-text-tertiary)" x="836" y="328">Gateway · TOPO · TA</text>
<text font-family="var(--joy-fontFamily-body, system-ui, sans-serif)" font-size="11" fill="var(--joy-palette-text-tertiary)" x="836" y="352">also needs FR-34 ✓ and FR-38</text>

<g color="var(--joy-palette-neutral-500)">
  <line stroke="var(--joy-palette-neutral-500)" stroke-width="1.3" fill="none" stroke-dasharray="5 4" x1="220" y1="280" x2="294" y2="280" marker-end="url(#dependencies-ar3)"/>
  <line stroke="var(--joy-palette-neutral-500)" stroke-width="1.3" fill="none" stroke-dasharray="5 4" x1="480" y1="280" x2="554" y2="280" marker-end="url(#dependencies-ar3)"/>
  <line stroke="var(--joy-palette-neutral-500)" stroke-width="1.3" fill="none" stroke-dasharray="5 4" x1="740" y1="280" x2="814" y2="280" marker-end="url(#dependencies-ar3)"/>
  <path stroke="var(--joy-palette-neutral-500)" stroke-width="1.3" fill="none" stroke-dasharray="5 4" d="M 450 86 L 450 236 L 930 236 L 930 246" marker-end="url(#dependencies-ar3)"/>
</g>
<text font-family="var(--joy-fontFamily-code, ui-monospace, Menlo, monospace)" font-size="10" x="700" y="230" fill="var(--joy-palette-neutral-500)">a PCR product to assemble</text>

<!-- legend -->
<text font-family="var(--joy-fontFamily-code, ui-monospace, Menlo, monospace)" font-size="10" x="24" y="404" fill="var(--joy-palette-text-tertiary)">solid outline = reachable now  ·  dashed = gated on FR-31  ·  filled = shipped</text>
        </svg>
