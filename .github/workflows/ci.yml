name: CI

# One workflow for both gates so the checks are never duplicated: pull requests get
# lint/test/build, and a push to main additionally publishes to Cloudflare Pages.
on:
  pull_request:
  push:
    branches: [main]

# Never let two deploys race; a queued one supersedes an in-flight one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Node 24: the version the actions themselves now run on, so the whole job is on
          # one major. Node 20 went end-of-life in April 2026.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      # Skips cleanly until CLOUDFLARE_API_TOKEN is added under repo Settings -> Secrets,
      # rather than failing every push in the meantime. The account id is not a credential
      # (it appears in dashboard URLs), so it is inlined and only one secret is needed.
      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 3b54d713791d243cfbed61dfeb46e1fc
        run: npx wrangler pages deploy dist --project-name plasmidviewer --branch main
