name: CI

# Pull requests only. Pushes to main run the same checks inside deploy.yml, which gates
# publishing on them — running this on push too would just duplicate that work.
on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
